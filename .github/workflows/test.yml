name: test

# Only run when something that actually affects the tests changes.
# Markdown-only / notes-only commits won't burn CI minutes or spam emails.
on:
  pull_request:
    branches: [main]
    paths:
      - 'services/**'
      - '.github/workflows/test.yml'
      - 'pyproject.toml'
  push:
    branches: [main]
    paths:
      - 'services/**'
      - '.github/workflows/test.yml'
      - 'pyproject.toml'

permissions:
  contents: read

jobs:
  test:
    name: test (${{ matrix.service }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service:
          - api
          - ingestion
          - meta-mcp
          - support-agent
          - orchestrator
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: |
            services/${{ matrix.service }}/pyproject.toml

      - name: Install service (with test extras)
        working-directory: services/${{ matrix.service }}
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[test]"

      - name: Install spaCy en_core_web_sm (meta-mcp only)
        if: matrix.service == 'meta-mcp'
        run: |
          python -m spacy download en_core_web_sm || true

      - name: Run pytest
        working-directory: services/${{ matrix.service }}
        env:
          PYTHONPATH: src
          PYTHONPYCACHEPREFIX: /tmp/vwpyc
          PYTHONDONTWRITEBYTECODE: "1"
        run: |
          python -m pytest -q tests/
