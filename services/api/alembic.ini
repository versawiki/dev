# Alembic config for versawiki-api.
#
# Migration target is selected at runtime via the VW_MIGRATION_TARGET
# environment variable, read by env.py:
#
#   VW_MIGRATION_TARGET=admin   -> versions/admin (singleton vw_admin schema)
#   VW_MIGRATION_TARGET=tenant  -> versions/tenant (one schema per tenant;
#                                  the schema name is supplied via
#                                  VW_TENANT_SCHEMA)
#
# The DSN is also read from env (VW_DATABASE_URL) so the same .ini
# works for dev, test, and prod.

[alembic]
script_location = src/versawiki_api/db/migrations

# We do NOT set sqlalchemy.url here. env.py reads VW_DATABASE_URL so
# the URL flows from versawiki_api.config.Settings.

prepend_sys_path = src
version_path_separator = os

# We use two version-script directories. env.py picks one based on
# VW_MIGRATION_TARGET. Alembic itself doesn't need both registered;
# we just point it at the parent and rely on env.py to set the path.
# (Older Alembic versions error if both are listed and have separate
# heads; the version_locations is set dynamically inside env.py.)

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
