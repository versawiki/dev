<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>{% block title %}Versawiki demo{% endblock %}</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    /* Wiki-style typography: serif body, generous line-height, narrow column. */
    .wiki-body {
      font-family: Georgia, "Times New Roman", serif;
      line-height: 1.7;
      max-width: 70ch;
    }
    .wiki-body h1, .wiki-body h2, .wiki-body h3 {
      font-family: Georgia, "Times New Roman", serif;
      font-weight: 600;
      margin-top: 1.4em;
      margin-bottom: 0.5em;
      line-height: 1.25;
    }
    .wiki-body h1 { font-size: 1.9rem; border-bottom: 1px solid #e5e7eb; padding-bottom: 0.3em; }
    .wiki-body h2 { font-size: 1.5rem; border-bottom: 1px solid #f3f4f6; padding-bottom: 0.2em; }
    .wiki-body h3 { font-size: 1.2rem; }
    .wiki-body p { margin: 0.9em 0; }
    .wiki-body ul, .wiki-body ol { margin: 0.9em 0; padding-left: 1.6em; }
    .wiki-body li { margin: 0.3em 0; }
    .wiki-body a { color: #1d4ed8; text-decoration: underline; }
    .wiki-body code {
      font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, monospace;
      background: #f3f4f6;
      padding: 0.1em 0.35em;
      border-radius: 4px;
      font-size: 0.9em;
    }
    .wiki-body pre {
      background: #0f172a;
      color: #f1f5f9;
      padding: 1em;
      border-radius: 6px;
      overflow-x: auto;
      font-size: 0.9em;
    }
    .wiki-body table { border-collapse: collapse; width: 100%; margin: 1em 0; }
    .wiki-body th, .wiki-body td {
      border: 1px solid #e5e7eb;
      padding: 0.4em 0.6em;
      text-align: left;
    }
  </style>
</head>
<body class="bg-stone-50 text-stone-900 min-h-screen">
  <nav class="bg-white border-b border-stone-200 shadow-sm">
    <div class="max-w-6xl mx-auto px-6 py-3 flex items-center justify-between gap-6">
      <a href="/" class="text-xl font-semibold text-stone-800 hover:text-stone-600">
        Versawiki demo
      </a>
      <form action="/search" method="get" class="flex-1 max-w-md">
        <input
          type="search"
          name="q"
          placeholder="Search titles + summaries..."
          value="{{ query | default('', true) }}"
          class="w-full px-3 py-1.5 border border-stone-300 rounded focus:outline-none focus:ring-2 focus:ring-blue-400"
        />
      </form>
      <a href="/" class="text-sm text-stone-600 hover:text-stone-900">Home</a>
    </div>
  </nav>

  <main class="max-w-6xl mx-auto px-6 py-8">
    {% block content %}{% endblock %}
  </main>
</body>
</html>
