[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "versawiki-orchestrator"
version = "0.1.0"
description = "Always-on Claude Agent SDK orchestrator for versawiki. Replaces the 4-hour Cowork cron."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Proprietary" }
authors = [{ name = "Versawiki team" }]

# Runtime dependencies. Locked-ish but loose enough to accept minor bumps.
# Major bumps require a DECISIONS.md entry.
dependencies = [
    "claude-agent-sdk>=0.1,<1",
    "fastapi>=0.115,<1",
    "uvicorn[standard]>=0.30,<1",
    "httpx>=0.27,<1",
    "pydantic>=2.9,<3",
    "pydantic-settings>=2.4,<3",
    "structlog>=24.4,<26",
    "anyio>=4.4,<5",
    "aiosmtplib>=3.0,<4",
]

[project.optional-dependencies]
test = [
    "pytest>=8.3,<9",
    "pytest-asyncio>=0.24,<1",
    "respx>=0.21,<1",
]
dev = [
    "ruff>=0.6,<1",
    "mypy>=1.11,<2",
]

[project.scripts]
versawiki-orchestrator = "versawiki_orchestrator.main:cli_main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
