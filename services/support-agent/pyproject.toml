[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "versawiki-support-agent"
version = "0.1.0"
description = "Versawiki autonomous customer-support agent (M1-CS-01)."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Proprietary" }
authors = [{ name = "Versawiki team" }]

# Runtime dependencies. Versions follow services/api/pyproject.toml style.
dependencies = [
    "fastapi>=0.115,<0.116",
    "pydantic>=2.9,<3",
    "structlog>=24.4,<26",
    "anthropic>=0.40,<1",
    "httpx>=0.27,<0.29",
]

[project.optional-dependencies]
test = [
    "pytest>=8.0,<10",
]
dev = [
    "ruff>=0.6,<1",
    "mypy>=1.11,<2",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
